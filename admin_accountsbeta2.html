<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts Management | CMCS VLS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e293b',
                        danger: '#ef4444',
                        success: '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; overflow: hidden; }
        .logo-watermark { position: fixed; inset: 0; z-index: -1; display: flex; justify-content: center; align-items: center; opacity: 0.06; pointer-events: none; }
        .logo-watermark img { height: 80%; filter: grayscale(1) brightness(0.5); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .nav-link { transition: all 0.3s ease; border: 1px solid transparent; }
        .nav-link:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
        .nav-link.active { background: white; color: black !important; }
        .sidebar { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(20px); border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .action-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .action-btn:hover { transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        .modern-table thead th {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            color: #64748b;
            background: #f8fafc;
            padding: 12px 24px;
            border-bottom: 1px solid #e2e8f0;
        }
        .modern-table tbody td {
            padding: 16px 24px;
            border-bottom: 1px solid #f1f5f9;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden">
<aside class="w-72 sidebar flex flex-col z-20">
        <div class="h-20 flex items-center px-8 border-b border-white/5">
            <div class="flex items-center gap-3">
                <img src="https://sklepagatesting.github.io/resources/Images/CMCSlogo.png" class="h-8 brightness-125">
                <span class="font-black text-lg tracking-tighter uppercase">CMCS <span class="text-gray-500">VLS</span></span>
            </div>
        </div>

        <nav class="flex-1 py-8 px-4 space-y-2 overflow-y-auto">
            <p class="px-4 text-[10px] font-bold text-gray-500 uppercase tracking-[0.3em] mb-4">Main Menu</p>
            <a href="admin_dashboard.html" class="nav-link flex items-center gap-4 px-4 py-3.5 rounded-2xl text-sm font-semibold text-gray-400">
                <i class="fa-solid fa-chart-line text-base"></i> Dashboard
            </a>
            <a href="admin_approvalbeta.html" class="nav-link flex items-center gap-4 px-4 py-3.5 rounded-2xl text-sm font-semibold text-gray-400">
                <i class="fa-solid fa-check-to-slot text-base"></i> Approvals
            </a>
            <a href="admin_setupbeta.html" class="nav-link active flex items-center gap-4 px-4 py-3.5 rounded-2xl text-sm font-semibold">
                <i class="fa-solid fa-school text-base"></i> Academic Setup
            </a>
            <a href="admin_classbeta.html" class="nav-link flex items-center gap-4 px-4 py-3.5 rounded-2xl text-sm font-semibold text-gray-400">
                <i class="fa-solid fa-chalkboard-user text-base"></i> Class Assignment
            </a>
            <a href="admin_recordsbeta.html" class="nav-link flex items-center gap-4 px-4 py-3.5 rounded-2xl text-sm font-semibold text-gray-400">
                <i class="fa-solid fa-folder-open text-base"></i> Master Record
            </a>
            <a href="admin_accountsbeta.html" class="nav-link active flex items-center gap-4 px-4 py-3.5 rounded-2xl text-sm font-semibold">
                <i class="fa-solid fa-users-gear text-base"></i> Accounts
            </a>
        </nav>

        <div class="p-6 border-t border-white/5">
            <a href="admin_edit.html" class="glass-card p-4 flex items-center gap-3 mb-4 block hover:border-white/20 transition-all">
                <div id="adminInitial" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-xs font-bold text-black uppercase">AD</div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-bold truncate uppercase text-white" id="adminName">Loading...</p>
                    <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Administrator</p>
                </div>
            </a>
            <button onclick="logout()" class="w-full py-3 rounded-xl bg-red-500/10 text-red-500 text-[10px] font-black uppercase tracking-[0.2em] hover:bg-red-500 hover:text-white transition-all">
                Sign Out
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 flex items-center justify-between px-10 border-b border-white/5">
            <h1 class="text-sm font-bold uppercase tracking-[0.2em] text-gray-400">User Account <span class="text-white">Management</span></h1>
            <div class="text-right">
                <p id="clock" class="text-sm font-black tracking-widest text-white">--:--</p>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-wrap gap-6 items-end">
                <div class="w-48">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">View Role</label>
                    <select id="roleFilter" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-xs font-bold text-gray-700 outline-none">
                        <option value="ALL">ALL USERS</option>
                        <option value="student">STUDENTS</option>
                        <option value="teacher">TEACHERS</option>
                    </select>
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Search Directory</label>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-gray-400 text-xs"></i>
                        <input type="text" id="userSearch" class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-10 pr-4 py-2.5 text-xs font-medium outline-none" placeholder="SEARCH BY NAME OR ID NUMBER...">
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse modern-table">
                        <thead>
                            <tr>
                                <th>User ID / Role</th>
                                <th>Full Name</th>
                                <th>Email Address</th>
                                <th>Dept / Course</th>
                                <th>Status</th>
                                <th class="text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody" class="text-sm text-gray-700 divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="notifModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-80 transform transition-all p-6 text-center">
            <div class="w-12 h-12 rounded-full bg-blue-100 text-primary flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-bell text-xl"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-2">System Message</h3>
            <p id="notifMessage" class="text-sm text-gray-600 mb-6"></p>
            <div id="confirmActions" class="hidden flex justify-center gap-3">
                <button id="btnYes" class="flex-1 bg-primary text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">Proceed</button>
                <button onclick="closeModal('notifModal')" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 transition">Cancel</button>
            </div>
            <div id="alertActions" class="flex justify-center">
                <button onclick="closeModal('notifModal')" class="w-full bg-gray-800 text-white py-2 rounded-lg text-sm font-semibold hover:bg-gray-900 transition">Okay</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, doc, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDaeNQF4qmW0vvwxUPp_NztnT0hoLzm1BQ",
        authDomain: "svls-289ee.firebaseapp.com",
        projectId: "svls-289ee",
        storageBucket: "svls-289ee.firebasestorage.app",
        messagingSenderId: "500705386198",
        appId: "1:500705386198:web:96f189662bc2aa99cf7377"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let allUsers = [];

    // --- NOTIFICATION SYSTEM ---
    window.showNotif = (msg, isConfirm = false, onYes = null) => {
        document.getElementById('notifMessage').innerText = msg;
        const confirmDiv = document.getElementById('confirmActions');
        const alertDiv = document.getElementById('alertActions');
        if (isConfirm) {
            confirmDiv.classList.remove('hidden'); confirmDiv.classList.add('flex');
            alertDiv.classList.add('hidden');
            document.getElementById('btnYes').onclick = () => { onYes(); closeModal('notifModal'); };
        } else {
            confirmDiv.classList.add('hidden'); confirmDiv.classList.remove('flex');
            alertDiv.classList.remove('hidden');
        }
        document.getElementById('notifModal').classList.remove('hidden');
        document.getElementById('notifModal').classList.add('flex');
    };

    window.closeModal = (id) => {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(id).classList.remove('flex');
    };

    // --- AUTHENTICATION & ADMIN ROLE CHECK ---
    onAuthStateChanged(auth, async user => {
        if (user) {
            try {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    const userData = snap.data();
                    if (userData.role === 'admin') {
                        document.getElementById('adminName').innerText = `${userData.lastname}, ${userData.firstname}`.toUpperCase();
                        document.getElementById('adminInitial').innerText = userData.firstname.charAt(0).toUpperCase();
                        syncUsers();
                    } else {
                        alert("ACCESS DENIED: Administrative privileges required.");
                        window.location.href = "login.html";
                    }
                } else {
                    window.location.href = "login.html";
                }
            } catch (err) {
                console.error("Auth Error:", err);
                window.location.href = "login.html";
            }
        } else { 
            window.location.href = "login.html"; 
        }
    });

    // --- DATA MANAGEMENT ---
    function syncUsers() {
        onSnapshot(collection(db, "users"), (snap) => {
            allUsers = [];
            snap.forEach(d => allUsers.push({ uid: d.id, ...d.data() }));
            renderTable();
        });
    }

    function renderTable() {
        const role = document.getElementById('roleFilter').value;
        const search = document.getElementById('userSearch').value.toUpperCase();
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';

        const filtered = allUsers.filter(u => {
            const matchRole = role === 'ALL' || u.role === role;
            const fullName = `${u.lastname} ${u.firstname}`.toUpperCase();
            const matchSearch = fullName.includes(search) || (u.studentId && u.studentId.includes(search));
            return matchRole && matchSearch && u.role !== 'admin';
        });

        tbody.innerHTML = filtered.map(u => {
            const dept = u.role === 'student' ? u.course : 'FACULTY';
            
            // Logic for Status Badges
            let statusLabel = 'ACTIVE';
            let statusClass = 'bg-success/10 text-success';
            
            if (u.status === 'disabled') {
                statusLabel = 'BLOCKED';
                statusClass = 'bg-danger/10 text-danger';
            } else if (u.status === 'pending') {
                statusLabel = 'PENDING';
                statusClass = 'bg-red-600 text-white shadow-sm'; // Highly visible Red for pending
            }

            return `
                <tr class="hover:bg-blue-50/30 transition-all border-b border-gray-100">
                    <td class="px-6 py-4">
                        <div class="font-bold text-gray-800">${u.studentId || 'N/A'}</div>
                        <div class="text-[10px] text-primary font-bold uppercase">${u.role}</div>
                    </td>
                    <td class="px-6 py-4 font-bold uppercase text-gray-800">${u.lastname}, ${u.firstname}</td>
                    <td class="px-6 py-4 text-xs lowercase text-gray-500">${u.email}</td>
                    <td class="px-6 py-4 text-[11px] font-bold text-gray-400 uppercase">${dept || '---'}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-[10px] font-bold ${statusClass}">
                            ${statusLabel}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick="handleEdit('${u.uid}', '${u.role}')" class="px-3 py-2 rounded-lg bg-blue-50 text-primary text-[10px] font-bold hover:bg-primary hover:text-white transition-all">
                                <i class="fa-solid fa-pen-to-square"></i> EDIT
                            </button>
                            <button onclick="handleBlock('${u.uid}', '${u.status}')" class="px-3 py-2 rounded-lg border border-gray-200 text-[10px] font-bold hover:bg-slate-800 hover:text-white transition-all">
                                <i class="fa-solid ${u.status === 'approved' ? 'fa-ban' : 'fa-circle-check'}"></i> 
                                ${u.status === 'approved' ? 'BLOCK' : 'APPROVE/UNBLOCK'}
                            </button>
                            <button onclick="handleDelete('${u.uid}')" class="px-3 py-2 rounded-lg bg-red-50 text-red-600 text-[10px] font-bold hover:bg-red-600 hover:text-white transition-all">
                                <i class="fa-solid fa-trash-can"></i> DELETE
                            </button>
                        </div>
                    </td>
                </tr>`;
        }).join('');
    }

    // --- ACTIONS ---
    window.handleBlock = (uid, currentStatus) => {
        // If they are approved, we block them. If they are pending or disabled, we approve them.
        const willBlock = currentStatus === 'approved';
        const msg = willBlock ? "Are you sure you want to BLOCK this user?" : "Approve and grant access for this user?";
        
        showNotif(msg, true, async () => {
            await updateDoc(doc(db, "users", uid), { 
                status: willBlock ? 'disabled' : 'approved' 
            });
        });
    };

    window.handleDelete = (uid) => {
        showNotif("PERMANENTLY DELETE THIS ACCOUNT? This action cannot be reversed.", true, async () => {
            await deleteDoc(doc(db, "users", uid));
        });
    };

    window.handleEdit = (uid, role) => {
        const page = role === 'student' ? 'enrollbeta2.html' : 'enroll_teacherbeta2.html';
        window.open(`${page}?edit=${uid}`, '_blank');
    };

    // --- EVENT LISTENERS ---
    document.getElementById('roleFilter').onchange = renderTable;
    document.getElementById('userSearch').oninput = renderTable;
    window.logout = () => signOut(auth).then(() => window.location.href = "login.html");
</script>
</body>
</html>
